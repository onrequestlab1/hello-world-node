name: Build and Deploy to Azure Container App

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

env:
  ACR_NAME: onrequestlabregistry
  ACR_LOGIN_SERVER: onrequestlabregistry.azurecr.io
  IMAGE_NAME: hello-world-node
  RESOURCE_GROUP: DefaultResourceGroup-WUS2
  CONTAINER_APP_NAME: hello-world-node
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest .

      - name: Push Docker image to ACR
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
